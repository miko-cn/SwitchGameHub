# Builds Windows NSIS installer (.exe) on GitHub-hosted runners.
# Triggers: manual workflow_dispatch, or a v* tag.
# public/data/games.json is committed; prepare-data uses CI mode when ../web is absent.
# Thumbs and small screenshots (public/thumbs, public/screenshots) live in Git LFS; checkout pulls them.
name: build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      # LFS: batch-download once and cache, instead of smudging 14k files one by one
      - name: List LFS objects
        shell: bash
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - name: Pull LFS objects
        shell: bash
        run: |
          git config lfs.concurrenttransfers 32
          git lfs pull
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python deps
        run: pip install pillow
      - name: Install JS deps
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-windows
          path: src-tauri/target/**/release/bundle/**
